[project]
name = "mcp-server"
version = "0.1.0"
description = "Python MCP server for local interactions with the QuantConnect API."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "python-dotenv>=0.23.0",
    "httpx>=0.28.1",
    "mcp[cli]>=1.9.3",
    "requests",
    "fastmcp>=2.12.5",
    "ruff>=0.14.1",
]

[project.scripts]
quantconnect-mcp = "main:cli"

[tool.ruff]
target-version = "py310"
exclude = ["tests/algorithms/syntax_errors.py"]

[tool.ruff.lint]
per-file-ignores = {"tests/algorithms/*.py" = ["F403", "F405"]}

[tool.pytest.ini_options]
pythonpath = "src tests"
